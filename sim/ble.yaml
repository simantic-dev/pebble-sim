# PebbleOS beside a second C3 running a passive BLE scanner (openble-scan): the scanner logs
# "RPT ... Pebble XXXX" for every advert PebbleOS sends.
machines:
  x4: { mcu: ESP32-C3, elf: out/flash.bin, overlay: x4.board }
  scan: { mcu: ESP32-C3, elf: scan.elf, overlay: scan.board }
media:
  - type: ble
    connect: [x4.radio, scan.radio]
timeout: 15
